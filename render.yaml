services:
  - type: web
    name: wiring-qr-manager
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wiring-qr-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_VERSION
        value: "20"

databases:
  - name: wiring-qr-db
    databaseName: wiringqr
    user: wiringqr
